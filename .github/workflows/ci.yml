# Lint and test on every push.
#
# The suite is designed to run WITHOUT the database: the ingest produces ~2 GB
# of raw XBRL that is deliberately gitignored, so a clean clone has no
# data/pledgecast.db. Verified locally by pointing DB_PATH at a path that does
# not exist - the suite passes and the database-backed API tests skip with an
# explanatory message rather than failing. (No test count is quoted here on
# purpose: a hand-written count is wrong the next time a test is added, and this
# comment carried a stale one for months.) That is why this workflow needs no
# fixture data,
# no secrets and no network access beyond installing dependencies.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the badge be refreshed by hand without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A second push to the same branch cancels the first - the older result is
  # about to be irrelevant anyway.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the pinned local environment. requirements.txt pins exact
          # versions, so a newer interpreter could resolve wheels this project
          # has never been run against.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Critical tests
        # Run these on their own first so a leakage or parser regression is the
        # headline failure rather than one red line among many.
        run: python -m pytest -m critical -q

      - name: Full suite
        # DB_PATH points at a file that will never exist. The database-backed
        # API tests then skip cleanly instead of failing, and nothing silently
        # picks up a stale local database.
        env:
          DB_PATH: /tmp/pledgecast-ci-no-such.db
        run: python -m pytest -q
