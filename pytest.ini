[pytest]
# Decision R5: put the repo root (for `config`) and src/ (for `pledgecast`) on
# sys.path without any packaging tooling. Native to pytest 7+.
pythonpath = . src

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short

# PLAN.md sec.15 priority tiers - run the ones that matter with `-m critical`.
markers =
    critical: leakage + parser + label tests (sec.15 three-star). Never skip these.
    leakage: point-in-time and label-shuffle proofs (sec.9.8).
    parser: XBRL parsing against committed fixture files.
    slow: hits the network or trains a model.

# Third-party noise only. Nothing here hides a warning raised by this project -
# 927 lines of shap/matplotlib/scipy deprecations made real failures easy to
# scroll past, which is the only reason these are filtered.
filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*
    ignore::DeprecationWarning:shap.*
    ignore::DeprecationWarning:sklearn.*
    ignore::DeprecationWarning:scipy.*
    ignore:.*parseString.*:DeprecationWarning
    ignore:.*resetCache.*:DeprecationWarning
    ignore:.*enablePackrat.*:DeprecationWarning
    # matplotlib's mathtext parser, reached once the dashboard tests import the
    # SHAP waterfall. Same third-party-noise rule as the block above.
    ignore::DeprecationWarning:pyparsing.*
    ignore::DeprecationWarning:matplotlib.*
